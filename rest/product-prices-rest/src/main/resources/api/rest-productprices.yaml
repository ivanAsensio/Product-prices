openapi: 3.0.3
info:
  title: ProductPrices
  description: >-
    This system will manage all product prices operations.
  contact:
    email: ivanasensioinformatica@gmail.com
  version: 1.0.0
servers:
  - url: http://localhost:8080
tags:
  - name: productprices
    description: Everything about product prices
paths:
  /product-prices:
    get:
      tags:
        - productprices
      summary: Retrieve the product price that match with params used in the query
      description: >-
        Returns the product price that match with datetime, productId and brandId
      operationId: retrieveProductPrice
      parameters:
        - name: datetime
          in: query
          required: true
          description: Date and hour to query the product price
          schema:
            type: string
            format: date-time
            example: "2020-06-14T10:00:00"
        - name: productId
          in: query
          required: true
          description: Product identifier
          schema:
            type: integer
            format: int64
            example: 12345
        - name: brandId
          in: query
          required: true
          description: Brand identifier
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPriceRetrieved'
        '400':
          description: Invalid data supplied
components:
  schemas:
    ProductPriceRetrieved:
      type: object
      additionalProperties: false
      required:
        - productId
        - brandId
        - price
        - startDate
        - endDate
      properties:
        productId:
          type: integer
          format: int64
          example: 1
        brandId:
          type: integer
          format: int64
          example: 1
        price:
          type: number
          format: double
          x-field-type: BigDecimal
          example: 99.99
        startDate:
          type: string
          format: date-time
          example: "2026-09-30T10:47:00"
        endDate:
          type: string
          format: date-time
          example: "2026-09-30T10:47:00"

