openapi: 3.0.3
info:
  title: ProductPrices
  description: >-
    This system will manage all product prices operations.
  contact:
    email: ivanasensioinformatica@gmail.com
  version: 1.0.0
servers:
  - url: http://localhost:8080
tags:
  - name: prices
    description: Everything about product prices
paths:
  /prices:
    get:
      tags:
        - prices
      summary: Retrieve the product price that match with params used in the query
      description: >-
        Returns the product price that match with datetime, productId and brandId
      operationId: retrieveProductPrice
      parameters:
        - name: datetime
          in: query
          required: true
          description: Date and hour to query the product price
          schema:
            type: string
            format: date-time
            example: "2020-06-14T10:00:00"
        - name: productId
          in: query
          required: true
          description: Product identifier
          schema:
            type: integer
            format: int64
            example: 12345
        - name: brandId
          in: query
          required: true
          description: Brand identifier
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceRetrieved'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 400
                code: INVALID_PRODUCT_PRICE_REQUEST
                message: "Datetime, productId and brandId cannot be null"
        '404':
          description: Product price not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 404
                code: PRODUCT_PRICE_NOT_FOUND
                message: "There is no product price for the given criteria"
        '500':
          description: Unexpected internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 500
                code: INTERNAL_SERVER_ERROR
                message: "An unexpected error occurred"
components:
  schemas:
    PriceRetrieved:
      type: object
      additionalProperties: false
      required:
        - productId
        - brandId
        - price
        - startDate
        - endDate
      properties:
        productId:
          type: integer
          format: int64
          example: 1
        brandId:
          type: integer
          format: int64
          example: 1
        price:
          type: number
          format: double
          x-field-type: BigDecimal
          example: 99.99
        currency:
          type: string
          example: "EUR"
        feeId:
          type: integer
          format: int64
          example: 1
        startDate:
          type: string
          format: date-time
          example: "2026-09-30T10:47:00"
        endDate:
          type: string
          format: date-time
          example: "2026-09-30T10:47:00"

    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - code
        - message
      properties:
        status:
          type: integer
          description: HTTP status code
          example: 400
        code:
          type: string
          description: Application-specific error code
          example: INVALID_PRODUCT_PRICE_REQUEST
        message:
          type: string
          description: Human-readable error message
          example: "Datetime, productId and brandId cannot be null"

